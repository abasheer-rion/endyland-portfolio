<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d"><title id="t">45 minutes by hand against 90 seconds scripted</title><desc id="d">Two bars on the same scale. The manual 12-point amplifier test took 45 minutes, which is 2,700 seconds. The scripted run takes 90 seconds, which is 30 times faster.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="400" fill="#F6EEDB"/><text x="24" y="44" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="500" fill="#5A3A22" text-anchor="start" >Time for the same 12-point amplifier test</text><text x="24" y="116" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="start" >By hand</text><rect x="190" y="84" width="760" height="52" rx="4" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="936" y="119" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="end" >45 minutes</text><text x="24" y="206" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="start" >Scripted</text><rect x="190" y="174" width="25.333333333333332" height="52" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="229.33333333333334" y="209" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="start" >90 seconds</text><text x="24" y="290" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#9C4A22" text-anchor="start" >45 minutes is 2,700 seconds, so the script is 30 times faster.</text><text x="24" y="330" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >12 points in 90 seconds is about 7.5 seconds a point, set up and charts included.</text><text x="24" y="364" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >Both bars are drawn to the same scale.</text></svg>