<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-labelledby="t d"><title id="t">One 90 second run</title><desc id="d">Four steps in order: set up the instruments, sweep 12 test points, draw the charts, flag any error. Twelve ticks mark the 12 test points.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="300" fill="#F6EEDB"/><rect x="30" y="40" width="210" height="96" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="135" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >1 Set up</text><text x="135" y="114" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="middle" >open the instruments</text><line x1="240" y1="88" x2="270" y2="88" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="270" y="40" width="210" height="96" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="375" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >2 Sweep</text><text x="375" y="114" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="middle" >12 test points</text><line x1="480" y1="88" x2="510" y2="88" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="510" y="40" width="210" height="96" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="615" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >3 Chart</text><text x="615" y="114" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="middle" >draw the plots</text><line x1="720" y1="88" x2="750" y2="88" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="750" y="40" width="210" height="96" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="855" y="82" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >4 Flag</text><text x="855" y="114" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="middle" >spot errors</text><line x1="280.0" y1="160" x2="280.0" y2="190" stroke="#17100A" stroke-width="3" /><line x1="297.27272727272725" y1="160" x2="297.27272727272725" y2="190" stroke="#17100A" stroke-width="3" /><line x1="314.54545454545456" y1="160" x2="314.54545454545456" y2="190" stroke="#17100A" stroke-width="3" /><line x1="331.8181818181818" y1="160" x2="331.8181818181818" y2="190" stroke="#17100A" stroke-width="3" /><line x1="349.0909090909091" y1="160" x2="349.0909090909091" y2="190" stroke="#17100A" stroke-width="3" /><line x1="366.3636363636364" y1="160" x2="366.3636363636364" y2="190" stroke="#17100A" stroke-width="3" /><line x1="383.6363636363636" y1="160" x2="383.6363636363636" y2="190" stroke="#17100A" stroke-width="3" /><line x1="400.9090909090909" y1="160" x2="400.9090909090909" y2="190" stroke="#17100A" stroke-width="3" /><line x1="418.1818181818182" y1="160" x2="418.1818181818182" y2="190" stroke="#17100A" stroke-width="3" /><line x1="435.4545454545455" y1="160" x2="435.4545454545455" y2="190" stroke="#17100A" stroke-width="3" /><line x1="452.72727272727275" y1="160" x2="452.72727272727275" y2="190" stroke="#17100A" stroke-width="3" /><line x1="470.0" y1="160" x2="470.0" y2="190" stroke="#17100A" stroke-width="3" /><text x="375" y="224" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >12 test points</text><text x="24" y="282" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#9C4A22" text-anchor="start" >The script caught a 3 dB error that manual checks missed.</text></svg>