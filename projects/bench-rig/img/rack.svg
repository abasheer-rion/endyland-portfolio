<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 510" width="1000" height="510" role="img" aria-labelledby="t d"><title id="t">The bench test rig</title><desc id="d">A computer running Python sends SCPI commands to a function generator and an oscilloscope. The function generator drives the amplifier under test and the oscilloscope measures its output. Results return to the computer, which charts them.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="510" fill="#F6EEDB"/><rect x="30" y="170" width="190" height="140" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="125.0" y="232.59" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >Computer</text><text x="125.0" y="265.09000000000003" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >Python</text><rect x="400" y="50" width="220" height="100" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="510.0" y="93.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >Function</text><text x="510.0" y="123.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >generator</text><rect x="400" y="330" width="220" height="100" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="510.0" y="388.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >Oscilloscope</text><rect x="780" y="190" width="190" height="100" rx="6" fill="#EFE3C8" stroke="#9C4A22" stroke-width="3" /><text x="875.0" y="233.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >Amplifier</text><text x="875.0" y="263.15999999999997" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >under test</text><path d="M 220 210 L 310 210 L 310 100 L 400 100" stroke="#17100A" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 220 270 L 310 270 L 310 380 L 400 380" stroke="#17100A" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 400 400 L 360 400 L 360 400" stroke="#17100A" stroke-width="0" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="250" y="90" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >SCPI commands</text><path d="M 620 100 L 700 100 L 700 215 L 780 215" stroke="#17100A" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="730" y="130" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="500" fill="#17100A" text-anchor="start" >test tone</text><path d="M 870 290 L 870 380 L 620 380" stroke="#17100A" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="760" y="372" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="500" fill="#17100A" text-anchor="middle" >output</text><path d="M 400 410 L 130 410 L 130 310" stroke="#9C4A22" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="160" y="448" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#9C4A22" text-anchor="start" >readings back to the computer</text><text x="24" y="496" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >A typical amplifier test setup, drawn for this site. The exact wiring is not shown.</text></svg>