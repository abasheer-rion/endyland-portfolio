<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">Slowest path before and after</title><desc id="d">Relative length of the slowest logic path. Before is 100. After is 78, which is 22 percent shorter. The 50 MHz clock stayed the target.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="330" fill="#F6EEDB"/><text x="24" y="44" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="500" fill="#5A3A22" text-anchor="start" >Slowest path through the logic, as a share of the old one</text><text x="24" y="116" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="start" >Before</text><rect x="160" y="84" width="780" height="52" rx="4" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="930" y="119" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="end" >100</text><text x="24" y="206" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="start" >After</text><rect x="160" y="174" width="608.4" height="52" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="758.4" y="209" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="end" >78</text><line x1="768.4" y1="242" x2="940" y2="242" stroke="#9C4A22" stroke-width="3" /><text x="854.2" y="284" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#9C4A22" text-anchor="middle" >22% shorter</text><text x="24" y="320" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >The finished design ran at 50 MHz on a Xilinx Artix-7.</text></svg>