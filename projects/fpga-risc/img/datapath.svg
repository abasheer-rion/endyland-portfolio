<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 540" width="1000" height="540" role="img" aria-labelledby="t d"><title id="t">Datapath of a five-stage 8-bit processor</title><desc id="d">Five stages left to right: fetch, decode, execute, memory and write back. Thin pipeline registers sit between the stages and all run on the 50 MHz clock. Write back feeds the register file.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="540" fill="#F6EEDB"/><rect x="30" y="24" width="176" height="48" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="118" y="56" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >1 Fetch</text><rect x="30" y="72" width="176" height="330" rx="4" fill="none" stroke="#5A3A22" stroke-width="2" stroke-dasharray="6 6"/><rect x="224" y="24" width="176" height="48" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="312" y="56" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >2 Decode</text><rect x="224" y="72" width="176" height="330" rx="4" fill="none" stroke="#5A3A22" stroke-width="2" stroke-dasharray="6 6"/><rect x="418" y="24" width="176" height="48" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="506" y="56" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >3 Execute</text><rect x="418" y="72" width="176" height="330" rx="4" fill="none" stroke="#5A3A22" stroke-width="2" stroke-dasharray="6 6"/><rect x="612" y="24" width="176" height="48" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="700" y="56" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >4 Memory</text><rect x="612" y="72" width="176" height="330" rx="4" fill="none" stroke="#5A3A22" stroke-width="2" stroke-dasharray="6 6"/><rect x="806" y="24" width="176" height="48" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="894" y="56" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >5 Write back</text><rect x="806" y="72" width="176" height="330" rx="4" fill="none" stroke="#5A3A22" stroke-width="2" stroke-dasharray="6 6"/><rect x="209" y="100" width="14" height="274" rx="2" fill="#17100A" /><rect x="403" y="100" width="14" height="274" rx="2" fill="#17100A" /><rect x="597" y="100" width="14" height="274" rx="2" fill="#17100A" /><rect x="791" y="100" width="14" height="274" rx="2" fill="#17100A" /><text x="500" y="440" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="middle" >Thin bars are pipeline registers. Every one is loaded on the same 50 MHz clock edge.</text><rect x="44" y="100" width="148" height="84" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="118.0" y="135.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >Program</text><text x="118.0" y="163.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >counter</text><rect x="44" y="222" width="148" height="84" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="118.0" y="257.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >Instruction</text><text x="118.0" y="285.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >memory</text><rect x="238" y="100" width="148" height="84" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="312.0" y="135.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >Control</text><text x="312.0" y="163.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >unit</text><rect x="238" y="222" width="148" height="84" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="312.0" y="257.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >Register</text><text x="312.0" y="285.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >file</text><rect x="432" y="160" width="148" height="108" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="506.0" y="207.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >ALU</text><text x="506.0" y="235.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >8-bit</text><rect x="626" y="160" width="148" height="108" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="700.0" y="207.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >Data</text><text x="700.0" y="235.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >memory</text><rect x="820" y="160" width="148" height="108" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="894.0" y="207.73" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >Select</text><text x="894.0" y="235.23" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >result</text><line x1="118" y1="184" x2="118" y2="222" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><line x1="312" y1="184" x2="312" y2="222" stroke="#17100A" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)" /><line x1="580" y1="214" x2="626" y2="214" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><line x1="774" y1="214" x2="820" y2="214" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><line x1="192" y1="264" x2="238" y2="264" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><line x1="386" y1="264" x2="432" y2="230" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><path d="M 386 142 L 506 142 L 506 160" stroke="#17100A" stroke-width="2" fill="none" stroke-dasharray="5 5" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><path d="M 894 268 L 894 352 L 312 352 L 312 308" stroke="#9C4A22" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="228" y="392" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="20" font-weight="600" fill="#9C4A22" text-anchor="start" >Result written back to the register file</text><line x1="40" y1="490" x2="100" y2="490" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><text x="112" y="497" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="start" >data</text><line x1="200" y1="490" x2="260" y2="490" stroke="#17100A" stroke-width="2" stroke-dasharray="5 5" marker-end="url(#ar)" /><text x="272" y="497" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="start" >control signals</text><line x1="470" y1="490" x2="530" y2="490" stroke="#9C4A22" stroke-width="3" marker-end="url(#ar)" /><text x="542" y="497" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#17100A" text-anchor="start" >write back</text><text x="960" y="497" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="end" >Drawn for this site, not a netlist.</text></svg>