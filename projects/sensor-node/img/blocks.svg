<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 400" width="1000" height="400" role="img" aria-labelledby="t d"><title id="t">Parts of the sensor node</title><desc id="d">A battery feeds a two-layer board. On the board an ESP32 reads a sensor over I2C. A pull-up resistor sits on the I2C lines.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="400" fill="#F6EEDB"/><rect x="30" y="140" width="200" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="130.0" y="187.59" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="middle" >18650</text><text x="130.0" y="220.09" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="middle" >cell</text><rect x="300" y="60" width="440" height="280" rx="6" fill="none" stroke="#17100A" stroke-width="2" /><text x="520" y="96" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#5A3A22" text-anchor="middle" >2-layer board (KiCad)</text><rect x="330" y="130" width="170" height="120" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="415.0" y="182.59" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >ESP32</text><text x="415.0" y="215.09" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="middle" >C firmware</text><rect x="560" y="130" width="150" height="70" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="635.0" y="173.84" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="middle" >Sensor</text><rect x="560" y="230" width="150" height="60" rx="6" fill="#EFE3C8" stroke="#9C4A22" stroke-width="3" /><text x="635.0" y="268.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#9C4A22" text-anchor="middle" >Pull-up</text><line x1="230" y1="195" x2="330" y2="195" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><line x1="500" y1="165" x2="560" y2="165" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><line x1="560" y1="185" x2="500" y2="185" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><text x="530" y="152" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="middle" >I2C</text><line x1="635" y1="230" x2="635" y2="200" stroke="#9C4A22" stroke-width="2" stroke-dasharray="5 5" /><rect x="800" y="140" width="170" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="885.0" y="188.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >Reading</text><text x="885.0" y="218.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >every 60 s</text><line x1="740" y1="195" x2="800" y2="195" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><text x="24" y="384" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >A missing pull-up resistor on the I2C lines was found with an oscilloscope.</text></svg>