<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">Battery life on one 18650 cell</title><desc id="d">Before: 3 days. After: 6 weeks, which is 42 days. That is 14 times longer.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="330" fill="#F6EEDB"/><text x="24" y="44" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="500" fill="#5A3A22" text-anchor="start" >Days on one 18650 cell</text><text x="24" y="116" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="start" >Before</text><rect x="160" y="84" width="55.714285714285715" height="52" rx="4" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="231.71428571428572" y="119" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="start" >3 days</text><text x="24" y="206" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="start" >After</text><rect x="160" y="174" width="780" height="52" rx="4" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="930" y="209" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="end" >6 weeks (42 days)</text><text x="24" y="290" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#9C4A22" text-anchor="start" >42 days is 14 times as long as 3 days.</text><text x="24" y="320" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >Same cell, same 60 second reading interval.</text></svg>