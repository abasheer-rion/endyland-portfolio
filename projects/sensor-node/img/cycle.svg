<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="1000" height="470" role="img" aria-labelledby="t d"><title id="t">Sleep and wake cycle of the sensor node</title><desc id="d">A schematic of supply current over time. The node sleeps at a very low current, wakes every 60 seconds for a short burst to read the sensor and send, then sleeps again. Not to scale.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="470" fill="#F6EEDB"/><line x1="90" y1="60" x2="90" y2="330" stroke="#17100A" stroke-width="2" /><line x1="90" y1="330" x2="970" y2="330" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><text x="100" y="46" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="500" fill="#5A3A22" text-anchor="start" >Current drawn</text><text x="970" y="364" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="500" fill="#5A3A22" text-anchor="end" >Time</text><path d="M 90 318 L 152 318 L 152 100 L 188 100 L 188 318 L 452 318 L 452 100 L 488 100 L 488 318 L 752 318 L 752 100 L 788 100 L 788 318 L 960 318" stroke="#9C4A22" stroke-width="4" fill="none" stroke-linejoin="round" stroke-linecap="round"/><text x="200" y="126" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#17100A" text-anchor="start" >awake: read and send</text><text x="320" y="292" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >deep sleep</text><line x1="170" y1="386" x2="170" y2="414" stroke="#17100A" stroke-width="2" /><line x1="470" y1="386" x2="470" y2="414" stroke="#17100A" stroke-width="2" /><line x1="170" y1="400" x2="470" y2="400" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><line x1="470" y1="400" x2="170" y2="400" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><text x="320.0" y="386" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >60 seconds</text><line x1="470" y1="386" x2="470" y2="414" stroke="#17100A" stroke-width="2" /><line x1="770" y1="386" x2="770" y2="414" stroke="#17100A" stroke-width="2" /><line x1="470" y1="400" x2="770" y2="400" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><line x1="770" y1="400" x2="470" y2="400" stroke="#17100A" stroke-width="2" marker-end="url(#ar)" /><text x="620.0" y="386" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >60 seconds</text><text x="24" y="448" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >Schematic, not to scale. The real current values are not shown because they are not on this page.</text></svg>