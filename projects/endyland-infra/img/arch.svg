<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 640" width="1000" height="640" role="img" aria-labelledby="t d"><title id="t">What runs where for endyland.com</title><desc id="d">Top lane, a deploy: a push to main runs the site checks, deploys to Cloudflare Pages, then checks that the live site serves the new commit. Bottom lane, uptime: every 5 minutes a Cloudflare Worker checks each service and writes the results to a D1 database, and the status page reads them.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="640" fill="#F6EEDB"/><text x="24" y="40" font-family='Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="start" >A change goes live</text><rect x="24" y="64" width="210" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="129.0" y="117.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Push to main</text><text x="129.0" y="140.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >GitHub</text><line x1="234" y1="119" x2="270" y2="119" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="270" y="64" width="210" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="375.0" y="117.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Site checks</text><text x="375.0" y="140.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >links, images, CSP</text><line x1="480" y1="119" x2="516" y2="119" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="516" y="64" width="210" height="110" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="621.0" y="117.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Deploy</text><text x="621.0" y="140.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >Cloudflare Pages</text><line x1="726" y1="119" x2="762" y2="119" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="762" y="64" width="210" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="867.0" y="117.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Verify</text><text x="867.0" y="140.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >/version.txt</text><text x="24" y="214" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >Only main can deploy. The deploy token can edit Pages and nothing else.</text><text x="24" y="290" font-family='Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="start" >Uptime is checked on its own</text><rect x="24" y="314" width="210" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="129.0" y="367.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Every 5 min</text><text x="129.0" y="390.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >Worker cron</text><line x1="234" y1="369" x2="270" y2="369" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="270" y="314" width="210" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="375.0" y="367.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Check services</text><text x="375.0" y="390.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >10 s timeout</text><line x1="480" y1="369" x2="516" y2="369" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="516" y="314" width="210" height="110" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="621.0" y="367.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Save results</text><text x="621.0" y="390.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >D1 database</text><line x1="726" y1="369" x2="762" y2="369" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><rect x="762" y="314" width="210" height="110" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="867.0" y="367.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="700" fill="#17100A" text-anchor="middle" >Status page</text><text x="867.0" y="390.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >cached 60 s</text><text x="24" y="466" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >Results are kept 90 days. The page shows the last 24 hours, 7 days, 30 days and 90 days.</text><text x="24" y="536" font-family='Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif' font-size="26" font-weight="700" fill="#17100A" text-anchor="start" >Two slower checks run on GitHub</text><rect x="24" y="560" width="448" height="60" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="248.0" y="597.14" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="600" fill="#17100A" text-anchor="middle" >Every 30 minutes: is every address up</text><rect x="496" y="560" width="480" height="60" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="736.0" y="597.14" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="600" fill="#17100A" text-anchor="middle" >Mondays: security.txt, sitemap, HSTS, CAA</text></svg>