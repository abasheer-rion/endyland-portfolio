<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 330" width="1000" height="330" role="img" aria-labelledby="t d"><title id="t">How the tools are handled with care</title><desc id="d">Read tools just look things up. Write tools change one record. Three tools are flagged in their titles as destructive or high impact: delete contact, delete opportunity and send message. Their descriptions tell Claude to confirm with the person first.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="330" fill="#F6EEDB"/><rect x="24" y="40" width="300" height="250" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="44" y="88" font-family='Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif' font-size="28" font-weight="700" fill="#17100A" text-anchor="start" >Look things up</text><text x="44" y="128" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >search, get and list</text><text x="44" y="154" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >tools</text><line x1="44" y1="214" x2="304" y2="214" stroke="#17100A" stroke-width="1" /><text x="44" y="244" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="700" fill="#17100A" text-anchor="start" >Nothing changes</text><rect x="344" y="40" width="300" height="250" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="364" y="88" font-family='Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif' font-size="28" font-weight="700" fill="#17100A" text-anchor="start" >Change one record</text><text x="364" y="128" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >create, update, tag,</text><text x="364" y="154" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >note and task tools</text><line x1="364" y1="214" x2="624" y2="214" stroke="#17100A" stroke-width="1" /><text x="364" y="244" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="700" fill="#17100A" text-anchor="start" >Only the fields</text><text x="364" y="270" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="700" fill="#17100A" text-anchor="start" >you send change</text><rect x="664" y="40" width="300" height="250" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="684" y="88" font-family='Newsreader,"Iowan Old Style","Palatino Linotype",Georgia,serif' font-size="28" font-weight="700" fill="#17100A" text-anchor="start" >Flagged high impact</text><text x="684" y="128" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >delete contact,</text><text x="684" y="154" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >delete opportunity,</text><text x="684" y="180" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="21" font-weight="400" fill="#17100A" text-anchor="start" >send message</text><line x1="684" y1="214" x2="944" y2="214" stroke="#17100A" stroke-width="1" /><text x="684" y="244" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="700" fill="#17100A" text-anchor="start" >Claude must confirm</text><text x="684" y="270" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="700" fill="#17100A" text-anchor="start" >with the person first</text></svg>