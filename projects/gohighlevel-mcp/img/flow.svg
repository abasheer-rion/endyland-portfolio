<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" width="1000" height="420" role="img" aria-labelledby="t d"><title id="t">From a question to the CRM</title><desc id="d">A person asks Claude in plain words. Claude calls one of 48 tools on an MCP server hosted on Vercel. The server checks a shared secret, then calls the GoHighLevel API and returns the answer as text.</desc><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerUnits="userSpaceOnUse" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#17100A"/></marker></defs><rect width="1000" height="420" fill="#F6EEDB"/><rect x="24" y="150" width="170" height="120" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="109.0" y="208.84" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="middle" >Person</text><text x="109.0" y="233.4" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="20" font-weight="400" fill="#5A3A22" text-anchor="middle" >asks in words</text><rect x="250" y="150" width="170" height="120" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="335.0" y="208.84" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="26" font-weight="600" fill="#17100A" text-anchor="middle" >Claude</text><text x="335.0" y="233.4" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="20" font-weight="400" fill="#5A3A22" text-anchor="middle" >picks a tool</text><rect x="476" y="110" width="270" height="200" rx="6" fill="#B8872E" stroke="#17100A" stroke-width="2" /><text x="611" y="152" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="28" font-weight="700" fill="#17100A" text-anchor="middle" >MCP server</text><text x="611" y="184" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="500" fill="#17100A" text-anchor="middle" >on Vercel (Next.js)</text><rect x="500" y="206" width="222" height="40" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="611.0" y="232.8" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="20" font-weight="600" fill="#17100A" text-anchor="middle" >checks the secret</text><rect x="500" y="254" width="222" height="40" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="611.0" y="280.8" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="20" font-weight="600" fill="#17100A" text-anchor="middle" >48 tools, 11 groups</text><rect x="804" y="150" width="172" height="120" rx="6" fill="#EFE3C8" stroke="#17100A" stroke-width="2" /><text x="890.0" y="208.16" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="24" font-weight="600" fill="#17100A" text-anchor="middle" >GoHighLevel</text><text x="890.0" y="231.6" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="18" font-weight="400" fill="#5A3A22" text-anchor="middle" >CRM API</text><line x1="194" y1="210" x2="250" y2="210" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><line x1="420" y1="210" x2="476" y2="210" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><line x1="746" y1="210" x2="804" y2="210" stroke="#17100A" stroke-width="3" marker-end="url(#ar)" /><path d="M 890 270 L 890 350 L 150 350 L 150 274" stroke="#9C4A22" stroke-width="3" fill="none" marker-end="url(#ar)" stroke-linejoin="round" stroke-linecap="round"/><text x="520" y="340" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="600" fill="#9C4A22" text-anchor="middle" >the answer comes back as text, errors too</text><text x="24" y="396" font-family='ui-sans-serif,system-ui,-apple-system,"Segoe UI","Helvetica Neue",Arial,sans-serif' font-size="22" font-weight="400" fill="#5A3A22" text-anchor="start" >Drawn for this site. Built for New Door, April 2026.</text></svg>