<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Diagram: twenty squares, each standing for ten devices, fill in one after another to show 200+ voice-network devices now backed up.</title>
<defs>
<pattern id="st" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".9" fill="#D9AE4A"/></pattern>
<pattern id="st2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="translate(3 4)"><circle cx="3" cy="3" r="1.1" fill="#D9AE4A"/></pattern>
<linearGradient id="fd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="mk"><rect width="800" height="450" fill="url(#fd)"/></mask>
<style>
text{font-family:-apple-system,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#EFE3C8}
.n{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-weight:700;fill:#D9AE4A;font-variant-numeric:lining-nums}
.l{font-size:32px}
.sq{fill:#D9AE4A;opacity:.16;animation:fl 6s ease-out infinite}
@keyframes fl{0%,6%{opacity:.16}22%,80%{opacity:1}100%{opacity:.16}}
.dot{animation:dr 4.8s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateY(0)}to{transform:translateY(var(--dy,300px))}}
</style>
</defs>
<rect width="800" height="450" fill="#26180F"/>
<rect y="428" width="800" height="22" fill="url(#st)" mask="url(#mk)" opacity=".7"/>
<rect class="sq" x="44" y="50" width="56" height="56" style="animation-delay:0.00s"/>
<rect class="sq" x="114" y="50" width="56" height="56" style="animation-delay:0.09s"/>
<rect class="sq" x="184" y="50" width="56" height="56" style="animation-delay:0.18s"/>
<rect class="sq" x="254" y="50" width="56" height="56" style="animation-delay:0.27s"/>
<rect class="sq" x="324" y="50" width="56" height="56" style="animation-delay:0.36s"/>
<rect class="sq" x="394" y="50" width="56" height="56" style="animation-delay:0.45s"/>
<rect class="sq" x="464" y="50" width="56" height="56" style="animation-delay:0.54s"/>
<rect class="sq" x="534" y="50" width="56" height="56" style="animation-delay:0.63s"/>
<rect class="sq" x="604" y="50" width="56" height="56" style="animation-delay:0.72s"/>
<rect class="sq" x="674" y="50" width="56" height="56" style="animation-delay:0.81s"/>
<rect class="sq" x="44" y="120" width="56" height="56" style="animation-delay:0.90s"/>
<rect class="sq" x="114" y="120" width="56" height="56" style="animation-delay:0.99s"/>
<rect class="sq" x="184" y="120" width="56" height="56" style="animation-delay:1.08s"/>
<rect class="sq" x="254" y="120" width="56" height="56" style="animation-delay:1.17s"/>
<rect class="sq" x="324" y="120" width="56" height="56" style="animation-delay:1.26s"/>
<rect class="sq" x="394" y="120" width="56" height="56" style="animation-delay:1.35s"/>
<rect class="sq" x="464" y="120" width="56" height="56" style="animation-delay:1.44s"/>
<rect class="sq" x="534" y="120" width="56" height="56" style="animation-delay:1.53s"/>
<rect class="sq" x="604" y="120" width="56" height="56" style="animation-delay:1.62s"/>
<rect class="sq" x="674" y="120" width="56" height="56" style="animation-delay:1.71s"/>
<text x="44" y="330" class="n" text-anchor="start" font-size="118">200+</text>
<text x="400" y="292" class="l" text-anchor="start" >devices</text>
<text x="400" y="336" class="l" text-anchor="start" >now backed up</text>
<text x="400" y="396" class="l" text-anchor="start" style="fill:#D9AE4A">Python and SSH</text>
</svg>
