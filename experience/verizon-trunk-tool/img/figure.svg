<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Diagram: carrier trunks are recorded in one record system with an API, which backs a $70M-a-year revenue line.</title>
<defs>
<pattern id="st" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".9" fill="#D9AE4A"/></pattern>
<pattern id="st2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="translate(3 4)"><circle cx="3" cy="3" r="1.1" fill="#D9AE4A"/></pattern>
<linearGradient id="fd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="mk"><rect width="800" height="450" fill="url(#fd)"/></mask>
<style>
text{font-family:-apple-system,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#EFE3C8}
.n{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-weight:700;fill:#D9AE4A;font-variant-numeric:lining-nums}
.l{font-size:32px}
.sq{fill:#D9AE4A;opacity:.16;animation:fl 6s ease-out infinite}
@keyframes fl{0%,6%{opacity:.16}22%,80%{opacity:1}100%{opacity:.16}}
.dot{animation:dr 4.8s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateY(0)}to{transform:translateY(var(--dy,300px))}}
</style>
</defs>
<rect width="800" height="450" fill="#26180F"/>
<rect y="428" width="800" height="22" fill="url(#st)" mask="url(#mk)" opacity=".7"/>
<circle cx="80" cy="100" r="26" fill="none" stroke="#EFE3C8" stroke-width="3"/>
<path d="M108 100L296 205" stroke="#B8872E" stroke-width="3" fill="none"/>
<rect x="-5" y="-5" width="10" height="10" fill="#D9AE4A"><animateMotion dur="2.4s" begin="0.0s" repeatCount="indefinite" path="M108 100L296 205"/></rect>
<rect x="-5" y="-5" width="10" height="10" fill="#D9AE4A"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M108 100L296 205"/></rect>
<circle cx="80" cy="205" r="26" fill="none" stroke="#EFE3C8" stroke-width="3"/>
<path d="M108 205L296 205" stroke="#B8872E" stroke-width="3" fill="none"/>
<rect x="-5" y="-5" width="10" height="10" fill="#D9AE4A"><animateMotion dur="2.4s" begin="0.5s" repeatCount="indefinite" path="M108 205L296 205"/></rect>
<rect x="-5" y="-5" width="10" height="10" fill="#D9AE4A"><animateMotion dur="2.4s" begin="1.7s" repeatCount="indefinite" path="M108 205L296 205"/></rect>
<circle cx="80" cy="310" r="26" fill="none" stroke="#EFE3C8" stroke-width="3"/>
<path d="M108 310L296 205" stroke="#B8872E" stroke-width="3" fill="none"/>
<rect x="-5" y="-5" width="10" height="10" fill="#D9AE4A"><animateMotion dur="2.4s" begin="1.0s" repeatCount="indefinite" path="M108 310L296 205"/></rect>
<rect x="-5" y="-5" width="10" height="10" fill="#D9AE4A"><animateMotion dur="2.4s" begin="2.2s" repeatCount="indefinite" path="M108 310L296 205"/></rect>
<text x="80" y="392" class="l" text-anchor="middle" >trunks</text>
<rect x="300" y="140" width="230" height="130" fill="#EFE3C8" fill-opacity=".08" stroke="#D9AE4A" stroke-width="3"/>
<text x="415" y="200" class="l" text-anchor="middle" style="font-size:36px">Record</text>
<text x="415" y="244" class="l" text-anchor="middle" style="font-size:34px">system + API</text>
<path d="M534 205H596" stroke="#B8872E" stroke-width="3" fill="none"/><path d="M590 193L604 205L590 217" stroke="#B8872E" stroke-width="3" fill="none"/>
<text x="690" y="222" class="n" text-anchor="middle" font-size="88">$70M</text>
<text x="690" y="268" class="l" text-anchor="middle" >a year</text>
</svg>
