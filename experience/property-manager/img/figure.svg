<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Diagram: 23 unit squares, rental income up 60% in 4 months, and nine of ten tenants kept.</title>
<defs>
<pattern id="st" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".9" fill="#D9AE4A"/></pattern>
<pattern id="st2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="translate(3 4)"><circle cx="3" cy="3" r="1.1" fill="#D9AE4A"/></pattern>
<linearGradient id="fd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="mk"><rect width="800" height="450" fill="url(#fd)"/></mask>
<style>
text{font-family:-apple-system,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#EFE3C8}
.n{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-weight:700;fill:#D9AE4A;font-variant-numeric:lining-nums}
.l{font-size:32px}
.sq{fill:#D9AE4A;opacity:.16;animation:fl 6s ease-out infinite}
@keyframes fl{0%,6%{opacity:.16}22%,80%{opacity:1}100%{opacity:.16}}
.dot{animation:dr 4.8s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateY(0)}to{transform:translateY(var(--dy,300px))}}
</style>
</defs>
<rect width="800" height="450" fill="#26180F"/>
<rect y="428" width="800" height="22" fill="url(#st)" mask="url(#mk)" opacity=".7"/>
<rect class="sq" x="40" y="44" width="42" height="42" style="animation-delay:0.00s"/>
<rect class="sq" x="92" y="44" width="42" height="42" style="animation-delay:0.12s"/>
<rect class="sq" x="144" y="44" width="42" height="42" style="animation-delay:0.24s"/>
<rect class="sq" x="196" y="44" width="42" height="42" style="animation-delay:0.36s"/>
<rect class="sq" x="248" y="44" width="42" height="42" style="animation-delay:0.48s"/>
<rect class="sq" x="300" y="44" width="42" height="42" style="animation-delay:0.60s"/>
<rect class="sq" x="40" y="96" width="42" height="42" style="animation-delay:0.72s"/>
<rect class="sq" x="92" y="96" width="42" height="42" style="animation-delay:0.84s"/>
<rect class="sq" x="144" y="96" width="42" height="42" style="animation-delay:0.96s"/>
<rect class="sq" x="196" y="96" width="42" height="42" style="animation-delay:1.08s"/>
<rect class="sq" x="248" y="96" width="42" height="42" style="animation-delay:1.20s"/>
<rect class="sq" x="300" y="96" width="42" height="42" style="animation-delay:1.32s"/>
<rect class="sq" x="40" y="148" width="42" height="42" style="animation-delay:1.44s"/>
<rect class="sq" x="92" y="148" width="42" height="42" style="animation-delay:1.56s"/>
<rect class="sq" x="144" y="148" width="42" height="42" style="animation-delay:1.68s"/>
<rect class="sq" x="196" y="148" width="42" height="42" style="animation-delay:1.80s"/>
<rect class="sq" x="248" y="148" width="42" height="42" style="animation-delay:1.92s"/>
<rect class="sq" x="300" y="148" width="42" height="42" style="animation-delay:2.04s"/>
<rect class="sq" x="40" y="200" width="42" height="42" style="animation-delay:2.16s"/>
<rect class="sq" x="92" y="200" width="42" height="42" style="animation-delay:2.28s"/>
<rect class="sq" x="144" y="200" width="42" height="42" style="animation-delay:2.40s"/>
<rect class="sq" x="196" y="200" width="42" height="42" style="animation-delay:2.52s"/>
<rect class="sq" x="248" y="200" width="42" height="42" style="animation-delay:2.64s"/>
<text x="40" y="300" class="l" text-anchor="start" >23 units</text>
<text x="400" y="140" class="n" text-anchor="start" font-size="112">+60%</text>
<text x="400" y="190" class="l" text-anchor="start" >rental income</text>
<text x="400" y="232" class="l" text-anchor="start" >in 4 months</text>
<circle cx="58" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="98" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="138" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="178" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="218" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="258" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="298" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="338" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="378" cy="350" r="14" fill="#D9AE4A" stroke="#D9AE4A" stroke-width="3"/>
<circle cx="418" cy="350" r="14" fill="none" stroke="#D9AE4A" stroke-width="3"/>
<text x="40" y="416" class="l" text-anchor="start" >9 in 10 tenants kept</text>
</svg>
