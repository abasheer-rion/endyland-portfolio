<text x="450" y="118" class="n" text-anchor="start" font-size="104">400+</text>
<text x="450" y="166" class="l" text-anchor="start" >families a month</text>
<text x="44" y="300" class="n" text-anchor="start" font-size="76">5+</text>
<text x="44" y="346" class="l" text-anchor="start" >volunteers</text>
<text x="330" y="300" class="n" text-anchor="start" font-size="76">15%</text>
<text x="330" y="346" class="l" text-anchor="start" >faster packing</text>
