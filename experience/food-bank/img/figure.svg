<circle class="sq" cx="276" cy="142" r="12" style="animation-delay:1.82s"/>
<circle class="sq" cx="312" cy="142" r="12" style="animation-delay:1.89s"/>
<circle class="sq" cx="348" cy="142" r="12" style="animation-delay:1.96s"/>
<circle class="sq" cx="384" cy="142" r="12" style="animation-delay:2.03s"/>
<circle class="sq" cx="60" cy="178" r="12" style="animation-delay:2.10s"/>
