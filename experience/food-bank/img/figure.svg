<circle class="sq" cx="384" cy="70" r="12" style="animation-delay:0.63s"/>
<circle class="sq" cx="60" cy="106" r="12" style="animation-delay:0.70s"/>
<circle class="sq" cx="96" cy="106" r="12" style="animation-delay:0.77s"/>
