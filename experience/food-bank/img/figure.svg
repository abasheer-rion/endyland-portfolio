<circle class="sq" cx="312" cy="106" r="12" style="animation-delay:1.19s"/>
<circle class="sq" cx="348" cy="106" r="12" style="animation-delay:1.26s"/>
<circle class="sq" cx="384" cy="106" r="12" style="animation-delay:1.33s"/>
