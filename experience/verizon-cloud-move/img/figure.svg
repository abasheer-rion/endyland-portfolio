<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img">
<title>Diagram: apps move from VMware to the internal cloud, saving $480K a year, with $2M+ more projected.</title>
<defs>
<pattern id="st" width="6" height="6" patternUnits="userSpaceOnUse"><circle cx="3" cy="3" r=".9" fill="#D9AE4A"/></pattern>
<pattern id="st2" width="9" height="9" patternUnits="userSpaceOnUse" patternTransform="translate(3 4)"><circle cx="3" cy="3" r="1.1" fill="#D9AE4A"/></pattern>
<linearGradient id="fd" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#fff"/><stop offset="1" stop-color="#000"/></linearGradient>
<mask id="mk"><rect width="800" height="450" fill="url(#fd)"/></mask>
<style>
text{font-family:-apple-system,'Segoe UI',system-ui,'Helvetica Neue',Arial,sans-serif;fill:#EFE3C8}
.n{font-family:'Iowan Old Style','Palatino Linotype',Georgia,serif;font-weight:700;fill:#D9AE4A;font-variant-numeric:lining-nums}
.l{font-size:32px}
.sq{fill:#D9AE4A;opacity:.16;animation:fl 6s ease-out infinite}
@keyframes fl{0%,6%{opacity:.16}22%,80%{opacity:1}100%{opacity:.16}}
.dot{animation:dr 4.8s ease-in-out infinite alternate}
@keyframes dr{from{transform:translateY(0)}to{transform:translateY(var(--dy,300px))}}
</style>
</defs>
<rect width="800" height="450" fill="#26180F"/>
<rect y="428" width="800" height="22" fill="url(#st)" mask="url(#mk)" opacity=".7"/>
<rect x="40" y="50" width="210" height="130" fill="none" stroke="#EFE3C8" stroke-width="3"/>
<text x="145" y="128" class="l" text-anchor="middle" style="font-size:36px">VMware</text>
<rect x="550" y="50" width="210" height="130" fill="#EFE3C8" fill-opacity=".08" stroke="#D9AE4A" stroke-width="3"/>
<text x="655" y="106" class="l" text-anchor="middle" style="font-size:36px">Internal</text>
<text x="655" y="148" class="l" text-anchor="middle" style="font-size:36px">cloud</text>
<path d="M256 115H542" stroke="#B8872E" stroke-width="3" fill="none"/><path d="M534 103L548 115L534 127" stroke="#B8872E" stroke-width="3" fill="none"/>
<rect x="-11" y="-9" width="22" height="18" fill="#D9AE4A"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M262 115L536 115"/></rect>
<rect x="-11" y="-9" width="22" height="18" fill="#D9AE4A"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M262 115L536 115"/></rect>
<rect x="-11" y="-9" width="22" height="18" fill="#D9AE4A"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M262 115L536 115"/></rect>
<text x="40" y="320" class="n" text-anchor="start" font-size="92">$480K</text>
<text x="40" y="372" class="l" text-anchor="start" >a year saved</text>
<text x="450" y="320" class="n" text-anchor="start" font-size="92">$2M+</text>
<text x="450" y="372" class="l" text-anchor="start" >more projected</text>
</svg>
