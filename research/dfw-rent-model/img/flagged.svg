<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 190" width="760" height="190" role="img" aria-labelledby="t d"><title id="t">Flagged units against all listings</title><desc id="d">A strip of 1,200 slots with 8 of them marked. 8 of more than 1,200 listings is under 1 percent.</desc><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#B8872E"/></pattern><pattern id="dots2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="translate(3 2)"><circle cx="4" cy="4" r="1.1" fill="#5A3A22"/></pattern></defs><rect width="760" height="190" fill="#F6EEDB"/><text x="20.0" y="34.0" font-family="'Newsreader',Georgia,'Times New Roman',serif" font-size="20" font-weight="600" text-anchor="start" fill="#17100A" >8 flagged out of 1,200+ listings</text><defs><pattern id="grid" width="7.2" height="9" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="2" fill="rgba(90,58,34,.45)"/></pattern></defs><rect x="20.0" y="56.0" width="720.0" height="108.0" rx="0" fill="url(#grid)" stroke="none" stroke-width="1" /><circle cx="288.9" cy="67.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="36.9" cy="94.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="418.5" cy="103.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="152.1" cy="112.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="670.5" cy="121.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="44.1" cy="139.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="339.3" cy="148.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><circle cx="245.7" cy="157.5" r="3.6" fill="#9C4A22" stroke="none" stroke-width="1"/><text x="20.0" y="184.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14.5" font-weight="400" text-anchor="start" fill="#5A3A22" >Each dot is one of 1,200 listings. The 8 rust dots are placed for drawing only, not by position in the data.</text></svg>
