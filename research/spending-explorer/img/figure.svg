<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="800" height="450" role="img" aria-labelledby="t d"><title id="t">Public spending data explorer, as drawn from the stated numbers</title><desc id="d">250 thousand plus county spending rows are cleaned and 40 plus duplicate vendors merged, so a search that took 20 minutes by hand takes under 5 seconds.</desc><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#B8872E"/></pattern><pattern id="dots2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="translate(3 2)"><circle cx="4" cy="4" r="1.1" fill="#5A3A22"/></pattern></defs><rect width="800" height="450" fill="#F6EEDB"/><text x="32.0" y="54.0" font-family="'Newsreader',Georgia,'Times New Roman',serif" font-size="26" font-weight="500" text-anchor="start" fill="#17100A" >Public spending data explorer</text><rect x="32.0" y="130.0" width="200.0" height="190.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="132.0" y="206.0" font-family="'Newsreader',Georgia,'Times New Roman',serif" font-size="40" font-weight="500" text-anchor="middle" fill="#17100A" >250K+</text><text x="132.0" y="244.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >rows of county</text><text x="132.0" y="267.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >spending records</text><rect x="300.0" y="130.0" width="200.0" height="190.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="400.0" y="206.0" font-family="'Newsreader',Georgia,'Times New Roman',serif" font-size="40" font-weight="500" text-anchor="middle" fill="#17100A" >40+</text><text x="400.0" y="244.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >duplicate vendors</text><text x="400.0" y="267.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >merged into one name</text><text x="400.0" y="290.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >each</text><rect x="568.0" y="130.0" width="200.0" height="190.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="668.0" y="206.0" font-family="'Newsreader',Georgia,'Times New Roman',serif" font-size="40" font-weight="500" text-anchor="middle" fill="#17100A" >&lt; 5 s</text><text x="668.0" y="244.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >a search, down from 20</text><text x="668.0" y="267.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="400" text-anchor="middle" fill="#5A3A22" >minutes by hand</text><line x1="236.0" y1="225.0" x2="290.0" y2="225.0" stroke="#5A3A22" stroke-width="2" /><path d="M294.0 225.0L285.9 228.9L285.9 221.1Z" fill="#5A3A22"/><line x1="504.0" y1="225.0" x2="558.0" y2="225.0" stroke="#5A3A22" stroke-width="2" /><path d="M562.0 225.0L553.9 228.9L553.9 221.1Z" fill="#5A3A22"/><text x="232.0" y="380.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5A3A22" >clean</text><text x="500.0" y="380.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="16" font-weight="400" text-anchor="middle" fill="#5A3A22" >merge, then search</text><text x="32.0" y="424.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-si