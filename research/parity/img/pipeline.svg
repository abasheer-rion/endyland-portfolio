<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 250" width="760" height="250" role="img" aria-labelledby="t d"><title id="t">How Parity works</title><desc id="d">Left to right: scrapers pull free daily data, strategy files turn it into target weights, one backtester replays history with costs, the gauntlet runs eleven tests, and the nightly job posts results to a private dashboard.</desc><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#B8872E"/></pattern><pattern id="dots2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="translate(3 2)"><circle cx="4" cy="4" r="1.1" fill="#5A3A22"/></pattern></defs><rect width="760" height="250" fill="#F6EEDB"/><rect x="10.0" y="24.0" width="130.0" height="156.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="75.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Scrapers</text><text x="75.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >9 currencies, 10</text><text x="75.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >rates, oil, gas,</text><text x="75.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >copper, S&amp;P 500,</text><text x="75.0" y="133.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >VIX</text><rect x="160.0" y="24.0" width="130.0" height="156.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="225.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Strategies</text><text x="225.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >One file each.</text><text x="225.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Data in, target</text><text x="225.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >weights out.</text><rect x="310.0" y="24.0" width="130.0" height="156.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="375.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Backtester</text><text x="375.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Costs, interest,</text><text x="375.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >same rules for</text><text x="375.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >all.</text><rect x="460.0" y="24.0" width="130.0" height="156.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="525.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Gauntlet</text><text x="525.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >11 fixed tests.</text><text x="525.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Bars set before</text><text x="525.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >the run.</text><rect x="610.0" y="24.0" width="130.0" height="156.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="675.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Dashboard</text><text x="675.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Nightly run,</text><text x="675.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >private.</text><text x="675.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Official runs go</text><text x="675.0" y="133.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >in the ledger.</text><line x1="141.0" y1="102.0" x2="154.0" y2="102.0" stroke="#5A3A22" stroke-width="2" /><path d="M158.0 102.0L149.9 105.9L149.9 98.1Z" fill="#5A3A22"/><line x1="291.0" y1="102.0" x2="304.0" y2="102.0" stroke="#5A3A22" stroke-width="2" /><path d="M308.0 102.0L299.9 105.9L299.9 98.1Z" fill="#5A3A22"/><line x1="441.0" y1="102.0" x2="454.0" y2="102.0" stroke="#5A3A22" stroke-width="2" /><path d="M458.0 102.0L449.9 105.9L449.9 98.1Z" fill="#5A3A22"/><line x1="591.0" y1="102.0" x2="604.0" y2="102.0" stroke="#5A3A22" stroke-width="2" /><path d="M608.0 102.0L599.9 105.9L599.9 98.1Z" fill="#5A3A22"/><text x="14.0" y="222.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="15.5" font-weight="400" text-anchor="start" fill="#5A3A22" >Official results come only from the ledger: plan written first, frozen code, fingerprinted data.</text></svg>
