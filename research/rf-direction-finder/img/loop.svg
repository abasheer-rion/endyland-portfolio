<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" role="img" aria-labelledby="t d"><title id="t">The find-then-steer loop</title><desc id="d">Five steps from left to right: a 5.8 GHz signal reaches a 2 by 2 antenna array, the array data goes to a direction finder, the result sets the phase shifters, and the beam points at the source. A Butler matrix route is drawn below.</desc><defs><pattern id="dots" width="5" height="5" patternUnits="userSpaceOnUse"><circle cx="2.5" cy="2.5" r="1" fill="#B8872E"/></pattern><pattern id="dots2" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="translate(3 2)"><circle cx="4" cy="4" r="1.1" fill="#5A3A22"/></pattern></defs><rect width="760" height="360" fill="#F6EEDB"/><rect x="14.0" y="24.0" width="128.0" height="160.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="78.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Signal</text><text x="78.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >A 5.8 GHz</text><text x="78.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >beacon arrives</text><text x="78.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >at some angle.</text><rect x="162.0" y="24.0" width="128.0" height="160.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="226.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Array</text><text x="226.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >2 by 2</text><text x="226.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >antennas,</text><text x="226.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >25.844 mm</text><text x="226.0" y="133.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >apart (half a</text><text x="226.0" y="152.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >wavelength).</text><rect x="310.0" y="24.0" width="128.0" height="160.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="374.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Find</text><text x="374.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >MUSIC turns</text><text x="374.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >the data into</text><text x="374.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >azimuth and</text><text x="374.0" y="133.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >elevation.</text><rect x="458.0" y="24.0" width="128.0" height="160.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="522.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Steer</text><text x="522.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Phase shifters</text><text x="522.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >point the beam</text><text x="522.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >at that angle.</text><rect x="606.0" y="24.0" width="128.0" height="160.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="670.0" y="52.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Beam</text><text x="670.0" y="76.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Most of the</text><text x="670.0" y="95.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >power goes</text><text x="670.0" y="114.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >toward the</text><text x="670.0" y="133.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >beacon.</text><line x1="143.0" y1="94.0" x2="156.0" y2="94.0" stroke="#5A3A22" stroke-width="2" /><path d="M160.0 94.0L151.9 97.9L151.9 90.1Z" fill="#5A3A22"/><line x1="291.0" y1="94.0" x2="304.0" y2="94.0" stroke="#5A3A22" stroke-width="2" /><path d="M308.0 94.0L299.9 97.9L299.9 90.1Z" fill="#5A3A22"/><line x1="439.0" y1="94.0" x2="452.0" y2="94.0" stroke="#5A3A22" stroke-width="2" /><path d="M456.0 94.0L447.9 97.9L447.9 90.1Z" fill="#5A3A22"/><line x1="587.0" y1="94.0" x2="600.0" y2="94.0" stroke="#5A3A22" stroke-width="2" /><path d="M604.0 94.0L595.9 97.9L595.9 90.1Z" fill="#5A3A22"/><text x="14.0" y="216.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="start" fill="#17100A" >The passive route, no phase measurement needed</text><rect x="14.0" y="232.0" width="170.0" height="112.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="99.0" y="260.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Butler matrix</text><text x="99.0" y="284.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >4 inputs make 4</text><text x="99.0" y="303.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >fixed beams.</text><rect x="214.0" y="232.0" width="170.0" height="112.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="299.0" y="260.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Power detector</text><text x="299.0" y="284.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Reads the power on</text><text x="299.0" y="303.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >each beam port.</text><rect x="414.0" y="232.0" width="150.0" height="112.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="489.0" y="260.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Pick the loudest</text><text x="489.0" y="284.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >The strongest</text><text x="489.0" y="303.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >port says roughly</text><text x="489.0" y="322.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >where.</text><rect x="584.0" y="232.0" width="160.0" height="112.0" rx="2" fill="#F6EEDB" stroke="#5A3A22" stroke-width="1.5" /><text x="664.0" y="260.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="17" font-weight="600" text-anchor="middle" fill="#17100A" >Point there</text><text x="664.0" y="284.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >Switch to that</text><text x="664.0" y="303.0" font-family="'Instrument Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A3A22" >beam.</text><line x1="185.0" y1="288.0" x2="208.0" y2="288.0" stroke="#5A3A22" stroke-width="2" /><path d="M212.0 288.0L203.9 291.9L203.9 284.1Z" fill="#5A3A22"/><line x1="385.0" y1="288.0" x2="408.0" y2="288.0" stroke="#5A3A22" stroke-width="2" /><path d="M412.0 288.0L403.9 291.9L403.9 284.1Z" fill="#5A3A22"/><line x1="565.0" y1="288.0" x2="578.0" y2="288.0" stroke="#5A3A22" stroke-width="2" /><path d="M582.0 288.0L573.9 291.9L573.9 284.1Z" fill="#5A3A22"/></svg>
