<title id="t">The in-store AI board</title>
<desc id="d">Block drawing of the NanoPi R76S store box: a Rockchip RK3576 chip with 4 GB of memory and 64 GB of eMMC storage, two 2.5 gigabit Ethernet ports, and a 5 volt USB-C power input. Drawn for this site, not a photo.</desc>
